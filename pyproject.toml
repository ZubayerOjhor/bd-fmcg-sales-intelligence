[project]
name = "fmcg-bd"
version = "1.0.0"
description = "End-to-end FMCG sales system for Bangladesh on synthetic data: route-to-market simulator, DuckDB warehouse, target engine and dashboard"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "pandas>=2.2", "numpy>=1.26", "pyarrow>=15"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "playwright>=1.44"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]  # long SQL strings read better on one line
